name: Catalog health

on:
  schedule:
    # Weekly. Not on push or pull_request: a dead upstream URL should not fail CI.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Catalog links and freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check catalog links
        run: node scripts/check-links.mjs
