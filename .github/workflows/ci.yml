name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Validate catalog
        run: node scripts/validate-catalog.mjs

      - name: Syntax check
        run: node scripts/check-syntax.mjs

      - name: Smoke tests
        run: node scripts/smoke-test.mjs

      # Freshness only: the network probe is the weekly catalog-health workflow,
      # so a dead upstream URL never fails a push.
      - name: Catalog freshness (offline)
        run: node scripts/check-links.mjs --offline

      # No herdr-app checkout in CI: build a local fixture from the catalog,
      # then check that --icons and --builtin really reject bad data.
      - name: Validate with a local fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/icons"
          node - "$fixture" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const out = process.argv[2];
          const text = fs.readFileSync("mods/more-agents/catalog.js", "utf8");
          const body = text.replace(/^(\s*\/\/[^\n]*\n)*/, "");
          const list = JSON.parse(body.match(/^\s*export default\s+([\s\S]*?);\s*$/)[1]);
          const programs = { programs: {} };
          for (const e of list) {
            if (e.icon.startsWith("icons/")) {
              fs.writeFileSync(path.join(out, "icons", e.icon.slice("icons/".length)), '<svg xmlns="http://www.w3.org/2000/svg"/>\n');
            }
            if (e.status === "builtin") programs.programs[e.id] = { run: e.run };
          }
          fs.writeFileSync(path.join(out, "programs.json"), JSON.stringify(programs, null, 2));
          NODE
          node scripts/validate-catalog.mjs --icons "$fixture/icons" --builtin "$fixture/programs.json"

          rm "$fixture/icons/agent.svg"
          if node scripts/validate-catalog.mjs --icons "$fixture/icons" --builtin "$fixture/programs.json"; then
            echo "validator accepted a missing icon" >&2
            exit 1
          fi

          node - "$fixture" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const out = process.argv[2];
          const programs = JSON.parse(fs.readFileSync(path.join(out, "programs.json"), "utf8"));
          delete programs.programs.gemini;
          fs.writeFileSync(path.join(out, "programs-incomplete.json"), JSON.stringify(programs, null, 2));
          NODE
          if node scripts/validate-catalog.mjs --icons "$fixture/icons" --builtin "$fixture/programs-incomplete.json"; then
            echo "validator accepted a builtin Herdr does not ship" >&2
            exit 1
          fi

      # GitHub's hosted runners do not ship herdr-app, so on CI this step only
      # prints the skip line. It is a convenience for self-hosted runners and a
      # local run; it is not a real check of the mod.
      - name: herdr-app check (only if installed)
        shell: bash
        run: |
          if command -v herdr-app >/dev/null 2>&1; then
            herdr-app check mods/more-agents
          else
            echo "herdr-app is not installed; skipping"
          fi

  # EXPERIMENTAL, not a merge gate. The author has no Windows machine, and the
  # smoke tests spawn `sh` and use POSIX paths, so a red run here is expected
  # until that is fixed. continue-on-error keeps the job out of the required
  # checks: a red experimental job must not block a merge. Remove that line
  # once Windows has actually been tested.
  test-windows:
    name: Node 22 on windows-latest (experimental)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Git Bash is what the tests expect; cmd.exe would not run them at all.
      - name: Validate catalog
        shell: bash
        run: node scripts/validate-catalog.mjs

      - name: Smoke tests
        shell: bash
        run: node scripts/smoke-test.mjs
